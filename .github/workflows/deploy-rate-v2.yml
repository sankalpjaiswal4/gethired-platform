name: Deploy GETHIRED contact rate limits v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: rlozvzlpapciwgointjp
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install atomic rate-limit RPC first
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          jq -n --rawfile query supabase/migrations/20260928050000_contact_rate_v2.sql '{query:$query}' > /tmp/query.json
          curl --fail-with-body -sS -o /tmp/result.json -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/query.json
          echo 'Rate-limit RPC installed'
      - name: Deploy contact function
        run: supabase functions deploy gethired-contact --project-ref "$REF" --no-verify-jwt
