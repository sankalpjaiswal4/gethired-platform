name: Deploy GETHIRED private AI sandbox
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy private synthetic function
        run: supabase functions deploy gethired-ai-sandbox --project-ref rlozvzlpapciwgointjp
