name: Deploy private synthetic owner pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Compile private synthetic pipeline
        run: npx -y tsc --noEmit --target ES2022 --lib ES2022,DOM --module ESNext --moduleResolution Bundler --skipLibCheck supabase/functions/gethired-owner-pipeline/index.ts
      - name: Deploy owner-only fixture pipeline
        run: supabase functions deploy gethired-owner-pipeline --project-ref rlozvzlpapciwgointjp
