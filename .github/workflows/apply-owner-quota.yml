name: Apply owner synthetic quota migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact migration through Supabase Management API
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          jq -n --rawfile query supabase/migrations/20260927150000_owner_quota.sql '{query:$query}' > /tmp/body.json
          http=$(curl --fail-with-body -sS -o /tmp/result.json -w '%{http_code}' \
            -X POST 'https://api.supabase.com/v1/projects/rlozvzlpapciwgointjp/database/query' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json)
          echo "Management API status $http"
          test "$http" = 201
          test "$(wc -c < /tmp/result.json)" -lt 3000
          cat /tmp/result.json
